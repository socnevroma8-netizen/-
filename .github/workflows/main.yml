name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    name: Build APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            python3-pip \
            python3-venv \
            autoconf \
            automake \
            autotools-dev \
            libtool \
            libtool-bin \
            m4 \
            gettext \
            autopoint \
            pkg-config \
            patch \
            cmake \
            ccache \
            zlib1g-dev \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libtinfo5 \
            libtinfo-dev

          libtoolize --version
          autoreconf --version

      - name: Create build environment
        run: |
          python -m venv .build-venv
          . .build-venv/bin/activate

          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            buildozer \
            "cython==0.29.33"

      - name: Build APK
        env:
          BUILDOZER_WARN_ON_ROOT: "0"
          JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
        run: |
          export PATH="$JAVA_HOME/bin:$PATH"
          echo "JAVA_HOME=$JAVA_HOME"
          which java
          java -version
          . .build-venv/bin/activate
          buildozer -v android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: schedule-apk
          path: bin/*.apk
          if-no-files-found: error
